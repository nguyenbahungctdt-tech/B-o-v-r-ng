name: Build iOS IPA (Sideload Ready)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare App Icons
        run: |
          ICON_PATH="Assets.xcassets/AppIcon.appiconset"
          SOURCE_ICON="$ICON_PATH/app_icon_forestry.jpg"
          TARGET_ICON="$ICON_PATH/icon-1024.png"
          
          if [ -f "$SOURCE_ICON" ]; then
            echo "Resizing $SOURCE_ICON to 1024x1024 PNG..."
            sips -s format png -z 1024 1024 "$SOURCE_ICON" --out "$TARGET_ICON"
          else
            echo "Error: Source icon not found at $SOURCE_ICON"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup GitHub Token for SPM
        run: |
          mkdir -p ~/.config/git
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          
          # Configure netrc for SPM package resolution
          cat > ~/.netrc << EOF
          machine github.com
          login ${{ secrets.GITHUB_TOKEN }}
          password x-oauth-basic
          EOF
          chmod 600 ~/.netrc
          
          # Configure git credentials
          git config --global credential.helper store
          echo "https://${{ secrets.GITHUB_TOKEN }}:x-oauth-basic@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project BaoVeRung.xcodeproj \
            -scheme BaoVeRung \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/BaoVeRung.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/BaoVeRung.xcarchive/Products/Applications/*.app Payload/
          zip -r BaoVeRung-Sideload.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaoVeRung-IPA
          path: BaoVeRung-Sideload.ipa
