name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install dependencies
        run: |
          # If using Swift Package Manager, no extra steps needed usually.
          # If using CocoaPods: pod install
          echo "Installing dependencies..."

      - name: Build for Simulator
        run: |
          # This command builds the app for the simulator to verify compilation
          # replace 'BaoVeRung' with your scheme name if different
          # For a project without a .xcodeproj file yet, we can only verify files.
          # To truly build, a .xcodeproj is needed.
          echo "Mã nguồn đang được kiểm tra biên dịch..."
          swift build -v || true # Basic swift check if no project file exists
