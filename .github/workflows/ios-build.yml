name: Build iOS IPA (Sideload Ready)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project BaoVeRung.xcodeproj \
            -scheme BaoVeRung \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/BaoVeRung.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/BaoVeRung.xcarchive/Products/Applications/*.app Payload/
          zip -r BaoVeRung-Sideload.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaoVeRung-IPA
          path: BaoVeRung-Sideload.ipa
